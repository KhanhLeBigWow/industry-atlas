<script>
document.addEventListener("atlas:ready", function () {
  "use strict";
  var esc = Atlas.esc;
  var id = Atlas.param("id") || "tsmc";
  var CO = (window.ATLAS_COMPANIES || {})[id];
  var main = document.getElementById("main");

  if (!CO) {
    main.innerHTML = '<div class="ind-hero"><h1>Unknown company</h1><p class="lede">No profile for "' + esc(id) + '". Company profiles are linked from each industry\'s Who Matters section.</p><p><a class="btn" href="index.html#industries">Browse industries</a></p></div>';
    return;
  }

  document.title = CO.name + " · Industry Atlas";
  var primaryInd = Atlas.store.industryById[CO.industries[0]];
  var sector = primaryInd ? Atlas.store.sectorById[primaryInd.sector] : null;
  var accent = sector ? sector.color : "#fab219";
  document.documentElement.style.setProperty("--sec", accent);

  function mono(name) {
    var words = name.replace(/[()]/g, "").split(/\s+/);
    return (words[0][0] + (words[1] ? words[1][0] : (words[0][1] || ""))).toUpperCase();
  }
  function paras(a) { return (a || []).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join(""); }
  function block(bid, ix, title, inner, lede) {
    return '<section class="block" id="' + bid + '"><h2><span class="b-ix">' + ix + "</span>" + esc(title) + "</h2>" + (lede ? '<p class="lede">' + esc(lede) + "</p>" : "") + inner + "</section>";
  }

  var indLinks = CO.industries.map(function (i) { return Atlas.indLink(i); }).join(" · ");
  var html = "";

  /* ----- hero ----- */
  html += '<header class="ind-hero">' +
    '<div class="co-hero-row"><div class="co-mono">' + esc(mono(CO.name)) + "</div><div>" +
    '<span class="kicker">' + (sector ? (sector.icon || "") + " " + esc(sector.name) : "Company") + " · Company profile</span>" +
    "<h1>" + esc(CO.name) + "</h1></div></div>" +
    '<p class="ind-tagline">' + esc(CO.full) + " · " + esc(CO.role) + " · founded " + CO.founded + " · " + esc(CO.hq) + "</p>" +
    '<div class="ind-meta"><span class="pill pill-amber">' + esc(CO.role) + '</span><span id="quote-pill" style="display:inline-flex"></span><span class="pill">Industries: </span><span class="small">' + indLinks + "</span></div>" +
    '<div class="stat-strip">' + (CO.stats || []).map(function (st) {
      return '<div class="stat-tile"><div class="stat-label">' + esc(st.label) + '</div><div class="stat-value">' + esc(st.value) + '</div><div class="stat-sub">' + esc(st.note || "") + "</div></div>";
    }).join("") + "</div></header>";

  /* ----- reading depth control + the one-pager ----- */
  function firstSentence(p) {
    var m = String(p || "").match(/^.*?[.!?](?=\s|$)/);
    return m ? m[0] : String(p || "");
  }
  function mixBar(mix) {
    if (!mix || !mix.length) return "";
    return '<div class="mix-bar" style="margin-top:10px">' + mix.map(function (m, i) {
      return '<i style="width:' + m.pct + '%;background:var(--viz-' + ((i % 8) + 1) + ')" title="' + esc(m.label) + " " + m.pct + '%"></i>';
    }).join("") + '</div><div class="mix-legend">' + mix.map(function (m, i) {
      return '<span><i style="background:var(--viz-' + ((i % 8) + 1) + ')"></i>' + esc(m.label) + " · " + m.pct + "%</span>";
    }).join("") + "</div>";
  }
  html += '<div class="view-seg" id="view-seg" aria-label="Reading depth">' +
    '<span class="vs-label">Read it as</span>' +
    '<button data-view="snapshot">⚡ Snapshot · 1 pager</button>' +
    '<button data-view="full">Full profile · super detailed</button></div>';

  html += '<section class="block onepager" id="onepager"><h2><span class="b-ix">1p</span>' + esc(CO.name) + " on one page</h2>" +
    '<div class="op-grid">' +
      '<div class="op-col"><h4>💡 How the money is made</h4>' +
        '<p class="small">' + esc(firstSentence(CO.model && CO.model[0])) + "</p>" +
        '<p class="small">' + esc(firstSentence(CO.model && CO.model[1])) + "</p>" +
        mixBar(CO.revenueMix) + "</div>" +
      '<div class="op-col"><h4><span class="fc-arrow">→</span> Sells to</h4><ul class="op-list">' +
        (CO.customers || []).slice(0, 3).map(function (c) { return "<li>" + esc(c.who) + (c.share ? ' <span class="fi-share">' + esc(c.share) + "</span>" : "") + "</li>"; }).join("") + "</ul>" +
        '<h4><span class="fc-arrow">←</span> Relies on</h4><ul class="op-list">' +
        (CO.suppliers || []).slice(0, 3).map(function (c) { return "<li>" + esc(c.who) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="op-col"><h4>🏰 The moat</h4><p class="small muted">' + esc(CO.moat) + "</p>" +
        '<h4>⚠ The risks</h4><p class="small muted">' + esc(CO.risks) + "</p></div>" +
    "</div>" +
    '<p style="margin-top:14px"><button class="btn btn-primary btn-sm" id="op-deep">Go super detailed ↓</button>' +
    '<span class="small faint" style="margin-left:10px">unlocks the full model, demand/supply sides, capital flows, and rivals</span></p></section>';

  /* ----- system diagram ----- */
  html += block("system", "01", "The system around " + CO.name,
    '<div class="figure" style="margin-top:1rem"><p class="figure-title">Supply side → ' + esc(CO.name) + ' → demand side</p>' +
    '<p class="figure-sub">Who feeds it, who buys from it, and where the capital enters and exits.</p>' +
    '<div id="sysdiagram"></div>' +
    '<p class="figure-note">Figures and shares approximate, from public filings and coverage.</p></div>');

  /* ----- newsroom ----- */
  html += block("news", "01b", "In the news · live",
    '<div id="news-feed"></div>',
    "Fresh coverage of " + CO.name + " from the global wires.");

  /* ----- business model ----- */
  html += block("model", "02", "How the money is made",
    '<div class="prose">' + paras(CO.model) + "</div>" +
    (CO.revenueMix && CO.revenueMix.length ?
      '<h4 style="margin-top:1.4rem">Revenue mix</h4><div class="mix-bar">' +
      CO.revenueMix.map(function (m, i) {
        return '<i style="width:' + m.pct + '%;background:var(--viz-' + ((i % 8) + 1) + ')" title="' + esc(m.label) + " " + m.pct + '%"></i>';
      }).join("") + "</div>" +
      '<div class="mix-legend">' + CO.revenueMix.map(function (m, i) {
        return '<span><i style="background:var(--viz-' + ((i % 8) + 1) + ')"></i>' + esc(m.label) + " · " + m.pct + "%</span>";
      }).join("") + "</div>" : ""));

  /* ----- demand & supply ----- */
  html += block("flows", "03", "Demand side · Supply side",
    '<div class="flow-cols">' +
      '<div class="flow-col"><h4><span class="fc-arrow">→</span> Who they sell to (demand)</h4>' +
      (CO.customers || []).map(function (c) {
        return '<div class="flow-item">' + (c.share ? '<span class="fi-share">' + esc(c.share) + "</span>" : "") + "<b>" + esc(c.who) + '</b><span class="fi-note">' + esc(c.note || "") + "</span></div>";
      }).join("") + "</div>" +
      '<div class="flow-col"><h4><span class="fc-arrow">←</span> Who supplies them (supply)</h4>' +
      (CO.suppliers || []).map(function (c) {
        return '<div class="flow-item"><b>' + esc(c.who) + '</b><span class="fi-note">' + esc(c.note || "") + "</span></div>";
      }).join("") + "</div>" +
    "</div>");

  /* ----- capital flows ----- */
  html += block("capital", "04", "Capital flows",
    '<div class="flow-cols">' +
      '<div class="flow-col in"><h4><span class="fc-arrow">↓</span> Where capital comes from</h4>' +
      (CO.capitalIn || []).map(function (c) {
        return '<div class="flow-item"><b>' + esc(c.source) + '</b><span class="fi-note">' + esc(c.note || "") + "</span></div>";
      }).join("") + "</div>" +
      '<div class="flow-col out"><h4><span class="fc-arrow">↑</span> Where capital goes</h4>' +
      (CO.capitalOut || []).map(function (c) {
        return '<div class="flow-item"><b>' + esc(c.use) + '</b><span class="fi-note">' + esc(c.note || "") + "</span></div>";
      }).join("") + "</div>" +
    "</div>");

  /* ----- moat, risks, rivals ----- */
  html += block("edge", "05", "Moat, risks, rivals",
    '<div class="grid-2">' +
      '<div class="card"><h4>🏰 The moat</h4><p class="small muted">' + esc(CO.moat) + "</p></div>" +
      '<div class="card"><h4>⚠ The risks</h4><p class="small muted">' + esc(CO.risks) + "</p></div>" +
    "</div>" +
    '<h4 style="margin-top:1rem">Competitors</h4><div class="vc-links small">' +
    (CO.competitors || []).map(function (c) {
      var cid = String(c).toLowerCase().replace(/\s+/g, "-");
      return (window.ATLAS_COMPANIES && window.ATLAS_COMPANIES[cid])
        ? '<a href="company.html?id=' + cid + '">' + esc(window.ATLAS_COMPANIES[cid].name) + "</a>"
        : "<span class='pill'>" + esc(c) + "</span>";
    }).join(" ") + "</div>" +
    '<p style="margin-top:1.4rem"><a class="btn" href="industry.html?id=' + CO.industries[0] + '#players">← Back to ' + esc(primaryInd ? primaryInd.name : "industry") + "</a> " +
    '<a class="btn" href="graph.html?focus=' + CO.industries[0] + '">See its industry in the graph →</a></p>');

  main.innerHTML = html;

  /* live quote pill */
  if (window.AtlasQuotes) AtlasQuotes.renderPricePill(document.getElementById("quote-pill"), CO.ticker);

  /* newsroom + docs rail */
  if (window.AtlasNews) {
    AtlasNews.render(document.getElementById("news-feed"),
      CO.newsQuery || ('"' + CO.name.replace(/\s*\(.*\)/, "") + '"'),
      { timespan: "7d", max: 7 });
  }
  Atlas.buildDocSide({});

  /* reading depth: snapshot (1 pager) vs full profile */
  var FULL_ONLY = ["news", "model", "flows", "capital", "edge"];
  function applyView(v) {
    try { localStorage.setItem("atlas2-co-view", v); } catch (e) {}
    document.querySelectorAll("#view-seg button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-view") === v);
    });
    document.getElementById("onepager").style.display = v === "snapshot" ? "" : "none";
    FULL_ONLY.forEach(function (bid) {
      var el = document.getElementById(bid);
      if (el) el.style.display = v === "snapshot" ? "none" : "";
    });
  }
  var view0 = null;
  try { view0 = localStorage.getItem("atlas2-co-view"); } catch (e) {}
  applyView(view0 === "full" ? "full" : "snapshot");
  document.querySelectorAll("#view-seg button").forEach(function (b) {
    b.addEventListener("click", function () { applyView(b.getAttribute("data-view")); });
  });
  document.getElementById("op-deep").addEventListener("click", function () {
    applyView("full");
    var m = document.getElementById("model");
    if (m) m.scrollIntoView({ behavior: "smooth" });
  });
  /* a docs-rail link to a section hidden in snapshot mode switches to full first */
  document.querySelectorAll(".doc-side a[data-sec]").forEach(function (a) {
    a.addEventListener("click", function () {
      var t = document.getElementById(a.getAttribute("data-sec"));
      if (t && t.style.display === "none") applyView("full");
    });
  });

  /* activate the system diagram */
  Viz.systemDiagram(document.getElementById("sysdiagram"), {
    accent: accent,
    label: CO.name + " system diagram",
    center: { title: CO.name, note: CO.role, subs: (CO.revenueMix || []).map(function (m) { return m.label + " · " + m.pct + "%"; }) },
    left: { title: "SUPPLY SIDE · inputs", items: (CO.suppliers || []).map(function (c) { return { name: c.who, note: c.note }; }) },
    right: { title: "DEMAND SIDE · customers", items: (CO.customers || []).map(function (c) { return { name: c.who + (c.share ? " (" + c.share + ")" : ""), note: c.note }; }) },
    capIn: { title: "CAPITAL FLOWS IN", items: (CO.capitalIn || []).map(function (c) { return { name: c.source, note: c.note }; }) },
    capOut: { title: "CAPITAL FLOWS OUT", items: (CO.capitalOut || []).map(function (c) { return { name: c.use, note: c.note }; }) },
    leftArrow: "supplies", rightArrow: "sells to"
  });
});
</script>
