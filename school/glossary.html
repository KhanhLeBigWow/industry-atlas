<!DOCTYPE html>
<html lang="en" data-module="glossary" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary · Capital Atlas</title>
<meta name="description" content="200+ finance terms defined in plain English: markets, accounting, valuation, M&A, private equity, credit, derivatives, and careers.">
<script>(function(){var t;try{t=localStorage.getItem("atlas-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atlas.css">
<style>
  .glo-count { font-size: 0.88rem; color: var(--ink-3); margin: 10px 0 0; }
  .glo-empty { padding: 40px 0; text-align: center; color: var(--ink-3); display: none; }
  .glo-empty.show { display: block; }
</style>
</head>
<body>
<main>

  <header class="module-hero">
    <span class="kicker">Reference · Glossary</span>
    <h1>The Glossary</h1>
    <p class="hero-tagline">Every trade has its dialect; finance has several. Here is the whole phrasebook in plain English, searchable, and honest about what the words are really doing.</p>
    <div class="hero-meta" data-manual="1"><span class="pill" id="glo-total-pill">Loading…</span></div>
  </header>

  <section class="lesson" id="browse">
    <input type="search" id="glo-search" class="search-input" placeholder="Search 200+ terms…" aria-label="Search glossary">
    <div class="filter-pills" id="glo-pills"></div>
    <p class="glo-count" id="glo-count"></p>
    <div id="glo-list"></div>
    <div class="glo-empty" id="glo-empty"><p>No matches. Try fewer letters, or clear the category filter.</p></div>
  </section>

</main>

<script src="assets/data/curriculum.js"></script>
<script src="assets/data/glossary.js"></script>
<script src="assets/js/atlas.js"></script>
<script>
document.addEventListener("atlas:ready", function () {
  "use strict";
  var ALL = (window.ATLAS_GLOSSARY || []).slice().sort(function (a, b) {
    return a.term.toLowerCase().localeCompare(b.term.toLowerCase());
  });
  var CATS = [];
  ALL.forEach(function (t) { if (CATS.indexOf(t.cat) === -1) CATS.push(t.cat); });
  CATS.sort();

  var activeCat = "All";
  var query = "";

  document.getElementById("glo-total-pill").textContent = ALL.length + " terms";

  /* category pills with counts */
  var pills = document.getElementById("glo-pills");
  function pillHtml(cat, count) {
    return '<button type="button" class="filter-pill' + (cat === activeCat ? " active" : "") + '" data-cat="' + cat + '">' + cat + " · " + count + "</button>";
  }
  function renderPills() {
    var html = pillHtml("All", ALL.length);
    CATS.forEach(function (c) {
      html += pillHtml(c, ALL.filter(function (t) { return t.cat === c; }).length);
    });
    pills.innerHTML = html;
  }
  pills.addEventListener("click", function (e) {
    var b = e.target.closest(".filter-pill");
    if (!b) return;
    activeCat = b.getAttribute("data-cat");
    renderPills();
    render();
  });

  /* term list, grouped by first letter */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function render() {
    var q = query.trim().toLowerCase();
    var shown = ALL.filter(function (t) {
      if (activeCat !== "All" && t.cat !== activeCat) return false;
      if (!q) return true;
      return t.term.toLowerCase().indexOf(q) !== -1 || t.def.toLowerCase().indexOf(q) !== -1;
    });
    var html = "", letter = "";
    shown.forEach(function (t) {
      var L = t.term.charAt(0).toUpperCase();
      if (!/[A-Z]/.test(L)) L = "#";
      if (L !== letter) { letter = L; html += '<div class="letter-head">' + L + "</div>"; }
      html += '<dl class="term-item"><dt>' + esc(t.term) + '<span class="pill">' + t.cat + "</span></dt><dd>" + esc(t.def) + "</dd></dl>";
    });
    document.getElementById("glo-list").innerHTML = html;
    document.getElementById("glo-empty").classList.toggle("show", shown.length === 0);
    document.getElementById("glo-count").textContent = shown.length === ALL.length
      ? "Showing all " + ALL.length + " terms"
      : "Showing " + shown.length + " of " + ALL.length + " terms";
  }

  document.getElementById("glo-search").addEventListener("input", function (e) {
    query = e.target.value || "";
    render();
  });

  renderPills();
  render();
});
</script>
</body>
</html>
